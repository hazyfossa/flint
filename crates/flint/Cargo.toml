[package]
name = "flint"
version = "0.9.0"
edition = "2024"


[dependencies]
fs-err = "3"
rustix = { version = "1", features = [
    "fs",
    "process",
    "rand",
    "stdio",
    "system",
] }
pastey = "0.2"
shrinkwraprs = "0.3.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
bon = "3.8.1"
argh = "0.1"
envy = { workspace = true }
flint-pam = { version = "0.1.0", path = "../pam" }
hazymacros = { version = "0.1.0", path = "../../../../hazymacros" }
zlink = "0.7"
pwd-grp = { version = "1", optional = true }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
serde_json = "1"
static-resource = { path = "../../../../static-resource" }
plug = { version = "0.1.0", path = "../../../../plug/crates/plug" }
eyre = "0.6"
futures-util = "0.3"


[features]
logind = []
seatd = []

userdb = []
nss = []

systemd = ["logind", "userdb"]
pwd-grp = ["dep:pwd-grp"]
# pwd = ["dep:pwd-grp"]
