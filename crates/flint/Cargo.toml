[package]
name = "flint"
version = "0.9.0"
edition = "2024"


[dependencies]
anyhow = "1.0.98"
binrw = "0.15.0"
fs-err = "3.1.3"
rustix = { version = "1.0.8", features = [
    "fs",
    "process",
    "rand",
    "stdio",
    "system",
] }
toml = "0.9.7"
paste = "1.0.15"
shrinkwraprs = "0.3.0"
bytes = "1.10.1"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
serde = { version = "1.0.228", features = ["derive"] }
bon = "3.8.1"
argh = "0.1.19"
log = "0.4.33"

envy = { workspace = true }
flint-pam = { version = "0.1.0", path = "../pam" }
flint-nss = { version = "0.1.0", path = "../nss", optional = true }
hazymacros = { version = "0.1.0", path = "../../../../hazymacros" }
dyn-utils = "0.1.1"
zlink = "0.7.0"
derive-where = { version = "1.6.1", features = ["serde"] }


[features]
logind = []
seatd = []

userdb = []
nss = []

systemd = ["logind", "userdb"]
flint-nss = ["dep:flint-nss"]
